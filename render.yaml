# Render Blueprint for the Apex Root Solutions API (contact form, newsletter,
# subscriber admin). The website itself is the Vercel project; see README.md.
services:
  - type: web
    name: apex-root-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SMTP_HOST
        value: mail.privateemail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: contact@apsoluts.com
      - key: SMTP_FROM
        value: Apex Root Solutions <contact@apsoluts.com>
      # Secrets: Render prompts for these on first deploy; never commit them.
      - key: MONGO_DB_URL
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
